  let sortAsc = true;

  const LABELS = {"MO": "Missouri", "TX": "Texas", "NC": "North Carolina", "TN": "Tennessee", "GA": "Georgia", "FL": "Florida", "DC": "Washington, D.C."};
  const PDFS = {"MO": "Best Employers - Missouri.pdf", "TX": "Best Employers - Texas.pdf", "NC": "Best Employers - North Carolina.pdf", "TN": "Best Employers - Tennessee.pdf", "GA": "Best Employers - Georgia.pdf", "FL": "Best Employers - Florida.pdf", "DC": "Best Employers - Washington DC.pdf"};

  function setState(s){
    state = s;
    document.body.className = 'state-' + s;
    Object.keys(LABELS).forEach(k =>
      document.getElementById('btn-' + k).classList.toggle('active', s === k));
    const count = DATA[s].length;
    document.getElementById('subtitle').innerHTML = LABELS[s] + ' &middot; Top ' + count;
    const pdf = document.getElementById('pdfLink');
    pdf.href = encodeURIComponent(PDFS[s]);
    pdf.textContent = '⬇ Download ' + LABELS[s] + ' PDF';
    sortKey = 'rank'; sortAsc = true;
    render();
  }

  function sortBy(k){
    if (sortKey === k){ sortAsc = !sortAsc; } else { sortKey = k; sortAsc = true; }
    render();
  }

  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    let rows = DATA[state].slice();
    if (q){
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) || r.hq.toLowerCase().includes(q));
    }
    rows.sort((a,b)=>{
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === 'rank'){ va = a.rank; vb = b.rank; }
      else if (sortKey === 'founded'){ va = parseInt(a.founded)||0; vb = parseInt(b.founded)||0; }
      else { va = (''+va).toLowerCase(); vb = (''+vb).toLowerCase(); }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    const tb = document.getElementById('tbody');
    tb.innerHTML = rows.map(r =>
      '<tr>' +
      '<td class="rank">' + r.rank + '</td>' +
      '<td class="name">' + esc(r.name) + '</td>' +
      '<td class="year">' + esc(r.founded) + '</td>' +
      '<td class="hq">' + esc(r.hq) + '</td>' +
      '</tr>').join('');

    document.getElementById('meta').textContent =
      'Showing ' + rows.length + ' of ' + DATA[state].length + ' companies' + (q ? ' (filtered)' : '');

    document.querySelectorAll('.sort-ind').forEach(el=>{
      el.textContent = (el.dataset.k === sortKey) ? (sortAsc ? '▲' : '▼') : '';
    });
  }

  function esc(s){
    return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  setState('TX');
